<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
    .title { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 34px; font-weight: 700; fill: #111; }
    .subtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 22px; font-weight: 600; fill: #111; }
    .boxtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 24px; font-weight: 700; fill: #111; }
    .boxtext { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 20px; font-weight: 500; fill: #111; }
    .small { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 18px; font-weight: 500; fill: #111; }
    .tiny { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 16px; font-weight: 500; fill: #111; }
    .note { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 19px; font-weight: 700; fill: #111; }
    .dash { stroke-dasharray: 8 8; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
  <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="white"/>
<text x="70" y="60" class="title" text-anchor="start">技术路线一：同构图下的联合静态调度（方案 A2）</text><line x1="60" y1="88" x2="1540" y2="88" stroke="#222" stroke-width="2.2"/><text x="60" y="126" class="subtitle" text-anchor="start">联合决策核心型：把“工序→站位→逐人团队”放在视觉中心，弱化枝节，突出核心贡献。</text><rect x="70" y="185" width="360" height="450" rx="10" ry="10" fill="#f7f7f7" stroke="#222" stroke-width="2.2"/><text x="250.0" y="219" class="boxtitle" text-anchor="middle">同构图与共享传播</text><text x="250.0" y="391.0" class="boxtext" text-anchor="middle"><tspan x="250.0" dy="0">保留完整工序图、站位与工人信息</tspan><tspan x="250.0" dy="26">以单一图上的共享传播形成节点/全局表示</tspan></text><line x1="140.0" y1="310.0" x2="250.0" y2="290.0" stroke="#333" stroke-width="2"/><line x1="250.0" y1="290.0" x2="360.0" y2="315.0" stroke="#333" stroke-width="2"/><line x1="140.0" y1="310.0" x2="195.0" y2="400.0" stroke="#333" stroke-width="2"/><line x1="250.0" y1="290.0" x2="195.0" y2="400.0" stroke="#333" stroke-width="2"/><line x1="250.0" y1="290.0" x2="310.0" y2="405.0" stroke="#333" stroke-width="2"/><line x1="360.0" y1="315.0" x2="310.0" y2="405.0" stroke="#333" stroke-width="2"/><line x1="195.0" y1="400.0" x2="155.0" y2="500.0" stroke="#333" stroke-width="2"/><line x1="310.0" y1="405.0" x2="345.0" y2="505.0" stroke="#333" stroke-width="2"/><line x1="195.0" y1="400.0" x2="345.0" y2="505.0" stroke="#333" stroke-width="2"/><circle cx="140.0" cy="310.0" r="26.0" fill="white" stroke="#222" stroke-width="2"/><text x="140.0" y="316.0" class="small" text-anchor="middle">工1</text><circle cx="250.0" cy="290.0" r="26.0" fill="white" stroke="#222" stroke-width="2"/><text x="250.0" y="296.0" class="small" text-anchor="middle">工2</text><circle cx="360.0" cy="315.0" r="26.0" fill="white" stroke="#222" stroke-width="2"/><text x="360.0" y="321.0" class="small" text-anchor="middle">工3</text><circle cx="195.0" cy="400.0" r="26.0" fill="white" stroke="#222" stroke-width="2"/><text x="195.0" y="406.0" class="small" text-anchor="middle">站1</text><circle cx="310.0" cy="405.0" r="26.0" fill="white" stroke="#222" stroke-width="2"/><text x="310.0" y="411.0" class="small" text-anchor="middle">站2</text><circle cx="155.0" cy="500.0" r="26.0" fill="white" stroke="#222" stroke-width="2"/><text x="155.0" y="506.0" class="small" text-anchor="middle">人1</text><circle cx="345.0" cy="505.0" r="26.0" fill="white" stroke="#222" stroke-width="2"/><text x="345.0" y="511.0" class="small" text-anchor="middle">人2</text><rect x="480" y="165" width="560" height="500" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="760.0" y="199" class="boxtitle" text-anchor="middle">条件联合解码（核心）</text><rect x="555" y="250" width="410" height="70" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="760.0" y="293.0" class="boxtext" text-anchor="middle"><tspan x="760.0" dy="0">工序  i ：合法工序候选</tspan></text><line x1="760" y1="320" x2="760" y2="350" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="555" y="350" width="410" height="70" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="760.0" y="393.0" class="boxtext" text-anchor="middle"><tspan x="760.0" dy="0">站位  m ：以工序 i 为条件</tspan></text><line x1="760" y1="420" x2="760" y2="450" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="555" y="450" width="410" height="70" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="760.0" y="493.0" class="boxtext" text-anchor="middle"><tspan x="760.0" dy="0">成员  w_r ：逐人选择至给定人数</tspan></text><rect x="530" y="560" width="460" height="60" rx="6" ry="6" fill="#fafafa" stroke="#222" stroke-width="2.2"/><text x="760.0" y="598.0" class="small" text-anchor="middle"><tspan x="760.0" dy="0">掩码：前序、站位、资格、人数、绑定与重复成员</tspan></text><rect x="1090" y="180" width="380" height="190" rx="10" ry="10" fill="#f7f7f7" stroke="#222" stroke-width="2.2"/><text x="1280.0" y="214" class="boxtitle" text-anchor="middle">约束落实与时间分配</text><text x="1280.0" y="256.0" class="boxtext" text-anchor="middle"><tspan x="1280.0" dy="0">前驱完成 + 人员日历</tspan><tspan x="1280.0" dy="26">确定可行起止时刻</tspan></text><rect x="1090" y="405" width="380" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1280.0" y="439" class="boxtitle" text-anchor="middle">更新安排</text><text x="1280.0" y="473.0" class="boxtext" text-anchor="middle"><tspan x="1280.0" dy="0">写入排程、人员占用与首次使用绑定</tspan></text><rect x="1090" y="560" width="380" height="105" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1280.0" y="594" class="boxtitle" text-anchor="middle">结果输出</text><text x="1280.0" y="620.5" class="boxtext" text-anchor="middle"><tspan x="1280.0" dy="0">完成构造后输出基准排程</tspan></text><line x1="430" y1="410" x2="480" y2="410" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1040" y1="410" x2="1090" y2="285" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1280" y1="370" x2="1280" y2="405" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1280" y1="525" x2="1280" y2="560" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="520" y="715" width="510" height="95" rx="10" ry="10" fill="#f2f2f2" stroke="#222" stroke-width="2.2"/><text x="775.0" y="749" class="boxtitle" text-anchor="middle">PPO 共同训练</text><text x="775.0" y="770.5" class="boxtext" text-anchor="middle"><tspan x="775.0" dy="0">同构图编码与联合策略沿用 PPO 共同训练</tspan></text><path d=" M 1280 665 L 1280 760 L 1030 760" fill="none" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><path d=" M 520 760 L 250 760 L 250 635" fill="none" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><text x="60" y="845" class="note" text-anchor="start">验证重点：完整可行性、排程质量与推理成本；新同构版本需单独训练与测试。</text></svg>