<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790">
<rect width="1600" height="790" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="black"/></marker></defs>
<g fill="black" font-family="Droid Sans Fallback, SimSun, serif">
<text x="260" y="65" font-size="43" font-weight="bold" text-anchor="middle">工作一</text>
<rect x="50" y="95" width="420" height="385" fill="white" stroke="black" stroke-width="2"/>
<text x="260" y="170" font-size="36" font-weight="bold" text-anchor="middle">无扰动静态调度</text>
<line x1="74" y1="224" x2="446" y2="224" stroke="black" stroke-width="1.5"/>
<text x="260" y="283" font-size="32" font-weight="normal" text-anchor="middle">同构图统一表示</text>
<text x="260" y="373" font-size="32" font-weight="normal" text-anchor="middle">工序—站位—团队</text>
<text x="260" y="422" font-size="32" font-weight="normal" text-anchor="middle">联合安排</text>
<text x="800" y="65" font-size="43" font-weight="bold" text-anchor="middle">工作二</text>
<rect x="590" y="95" width="420" height="385" fill="white" stroke="black" stroke-width="2"/>
<text x="800" y="147" font-size="36" font-weight="bold" text-anchor="middle">工序延迟开工后的</text>
<text x="800" y="197" font-size="36" font-weight="bold" text-anchor="middle">动态调度</text>
<line x1="614" y1="224" x2="986" y2="224" stroke="black" stroke-width="1.5"/>
<text x="800" y="283" font-size="32" font-weight="normal" text-anchor="middle">异构图区分实体与关系</text>
<text x="800" y="373" font-size="32" font-weight="normal" text-anchor="middle">兼顾完工效率</text>
<text x="800" y="422" font-size="32" font-weight="normal" text-anchor="middle">与计划稳定性</text>
<text x="1340" y="65" font-size="43" font-weight="bold" text-anchor="middle">工作三</text>
<rect x="1130" y="95" width="420" height="385" fill="white" stroke="black" stroke-width="2"/>
<text x="1340" y="170" font-size="36" font-weight="bold" text-anchor="middle">多架次协同动态调度</text>
<line x1="1154" y1="224" x2="1526" y2="224" stroke="black" stroke-width="1.5"/>
<text x="1340" y="283" font-size="32" font-weight="normal" text-anchor="middle">语义增强图网络</text>
<text x="1340" y="373" font-size="32" font-weight="normal" text-anchor="middle">跟踪多架飞机实际进度</text>
<text x="1340" y="422" font-size="32" font-weight="normal" text-anchor="middle">共同脉动与紧邻下一周期</text>
<line x1="490" y1="288" x2="570" y2="288" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="1030" y1="288" x2="1110" y2="288" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="65" y="550" font-size="34" font-weight="bold" text-anchor="start">工作一 → 工作二</text>
<text x="65" y="600" font-size="32" font-weight="normal" text-anchor="start">区分前序、技能和占用关系，</text>
<text x="65" y="645" font-size="32" font-weight="normal" text-anchor="start">并处理延迟开工后的计划调整。</text>
<text x="825" y="550" font-size="34" font-weight="bold" text-anchor="start">工作二 → 工作三</text>
<text x="825" y="600" font-size="32" font-weight="normal" text-anchor="start">局部安排影响共同脉动及下一周期，</text>
<text x="825" y="645" font-size="32" font-weight="normal" text-anchor="start">需要多架次状态与时间后果信息。</text>
<line x1="50" y1="698" x2="1550" y2="698" stroke="black" stroke-width="1.5"/>
<text x="800" y="754" font-size="32" font-weight="normal" text-anchor="middle">共同基础：工艺与人员约束、工序—站位—团队联合决策、可行性检查</text>
</g></svg>