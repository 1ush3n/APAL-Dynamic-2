<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
    .title { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 34px; font-weight: 700; fill: #111; }
    .subtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 22px; font-weight: 600; fill: #111; }
    .boxtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 24px; font-weight: 700; fill: #111; }
    .boxtext { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 20px; font-weight: 500; fill: #111; }
    .small { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 18px; font-weight: 500; fill: #111; }
    .tiny { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 16px; font-weight: 500; fill: #111; }
    .note { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 19px; font-weight: 700; fill: #111; }
    .dash { stroke-dasharray: 8 8; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
  <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="white"/>
<text x="70" y="60" class="title" text-anchor="start">技术路线二：异构联合调度与计划稳定性（方案 A3）</text><line x1="60" y1="88" x2="1540" y2="88" stroke="#222" stroke-width="2.2"/><text x="60" y="126" class="subtitle" text-anchor="start">关系 + 冻结双核心型：上半聚焦异构关系表示，下半聚焦冻结边界与修复范围，不让细节喧宾夺主。</text><rect x="70" y="190" width="620" height="250" rx="10" ry="10" fill="#f7f7f7" stroke="#222" stroke-width="2.2"/><text x="380.0" y="224" class="boxtitle" text-anchor="middle">异构关系表示（核心一）</text><rect x="120" y="255" width="120" height="55" rx="6" ry="6" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="180.0" y="290.5" class="boxtext" text-anchor="middle"><tspan x="180.0" dy="0">工序</tspan></text><rect x="290" y="255" width="120" height="55" rx="6" ry="6" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="350.0" y="290.5" class="boxtext" text-anchor="middle"><tspan x="350.0" dy="0">站位</tspan></text><rect x="120" y="390" width="120" height="55" rx="28" ry="28" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="180.0" y="425.5" class="boxtext" text-anchor="middle"><tspan x="180.0" dy="0">人员</tspan></text><polygon points="365,377 420,417 365,457 310,417" fill="white" stroke="#222" stroke-width="2"/><text x="365" y="425" class="small" text-anchor="middle">技能</text><line x1="240" y1="282" x2="290" y2="282" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><text x="265" y="273" class="tiny" text-anchor="middle">归属</text><line x1="180" y1="310" x2="180" y2="390" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><text x="208" y="360" class="tiny" text-anchor="start">安排</text><line x1="240" y1="417" x2="310" y2="417" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><text x="275" y="405" class="tiny" text-anchor="middle">资格</text><line x1="365" y1="377" x2="365" y2="310" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><text x="396" y="350" class="tiny" text-anchor="start">需求</text><rect x="430" y="255" width="210" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="535.0" y="289" class="boxtitle" text-anchor="middle">异构图编码</text><text x="535.0" y="323.0" class="boxtext" text-anchor="middle"><tspan x="535.0" dy="0">按关系传播与读出</tspan></text><line x1="415" y1="320" x2="430" y2="315" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="820" y="190" width="680" height="250" rx="10" ry="10" fill="#f7f7f7" stroke="#222" stroke-width="2.2"/><text x="1160.0" y="224" class="boxtitle" text-anchor="middle">联合选择与初始排程</text><rect x="880" y="275" width="100" height="55" rx="5" ry="5" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="930.0" y="310.5" class="boxtext" text-anchor="middle"><tspan x="930.0" dy="0">工序</tspan></text><rect x="1020" y="275" width="100" height="55" rx="5" ry="5" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1070.0" y="310.5" class="boxtext" text-anchor="middle"><tspan x="1070.0" dy="0">站位</tspan></text><rect x="1160" y="265" width="120" height="75" rx="5" ry="5" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1220.0" y="283.5" class="boxtext" text-anchor="middle"><tspan x="1220.0" dy="0">具体</tspan><tspan x="1220.0" dy="26">团队</tspan></text><rect x="1320" y="255" width="130" height="95" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1385.0" y="283.5" class="boxtext" text-anchor="middle"><tspan x="1385.0" dy="0">初始排程</tspan><tspan x="1385.0" dy="26">可行起止时刻</tspan></text><line x1="980" y1="302" x2="1020" y2="302" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1120" y1="302" x2="1160" y2="302" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1280" y1="302" x2="1320" y2="302" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="70" y="510" width="1430" height="280" rx="10" ry="10" fill="#f7f7f7" stroke="#222" stroke-width="2.2"/><text x="785.0" y="544" class="boxtitle" text-anchor="middle">冻结边界与修复范围（核心二）</text><line x1="140" y1="610" x2="780" y2="610" stroke="#222" stroke-width="2.2"/><rect x="175" y="555" width="70" height="45" rx="4" ry="4" fill="white" stroke="#222" stroke-width="2.2"/><text x="210.0" y="585.5" class="boxtext" text-anchor="middle"><tspan x="210.0" dy="0">工序1</tspan></text><circle cx="210" cy="610" r="5" fill="#222"/><rect x="325" y="555" width="70" height="45" rx="4" ry="4" fill="white" stroke="#222" stroke-width="2.2"/><text x="360.0" y="585.5" class="boxtext" text-anchor="middle"><tspan x="360.0" dy="0">工序2</tspan></text><circle cx="360" cy="610" r="5" fill="#222"/><rect x="605" y="555" width="70" height="45" rx="4" ry="4" fill="white" stroke="#222" stroke-width="2.2"/><text x="640.0" y="585.5" class="boxtext" text-anchor="middle"><tspan x="640.0" dy="0">工序3</tspan></text><circle cx="640" cy="610" r="5" fill="#222"/><rect x="755" y="555" width="70" height="45" rx="4" ry="4" fill="white" stroke="#222" stroke-width="2.2"/><text x="790.0" y="585.5" class="boxtext" text-anchor="middle"><tspan x="790.0" dy="0">工序4</tspan></text><circle cx="790" cy="610" r="5" fill="#222"/><line x1="500" y1="540" x2="500" y2="665" stroke="#222" stroke-width="2.2" class="dash"/><text x="500" y="530" class="small" text-anchor="middle">重调度边界</text><text x="260" y="675" class="small" text-anchor="middle"><tspan x="260" dy="0">冻结条目：保留原站位、团队与起止时刻</tspan></text><text x="715" y="675" class="small" text-anchor="middle"><tspan x="715" dy="0">允许调整：结合更新释放条件重新确定可行安排</tspan></text><rect x="980" y="555" width="220" height="75" rx="6" ry="6" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1090.0" y="600.5" class="boxtext" text-anchor="middle"><tspan x="1090.0" dy="0">基准已使用人员</tspan></text><rect x="980" y="660" width="220" height="75" rx="6" ry="6" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1090.0" y="705.5" class="boxtext" text-anchor="middle"><tspan x="1090.0" dy="0">阶段内保留原站位</tspan></text><line x1="1090" y1="630" x2="1090" y2="660" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1260" y="570" width="180" height="150" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1350.0" y="604" class="boxtitle" text-anchor="middle">修复流程</text><text x="1350.0" y="600.0" class="boxtext" text-anchor="middle"><tspan x="1350.0" dy="0">冻结与绑定继承</tspan><tspan x="1350.0" dy="26">→ 联合选择</tspan><tspan x="1350.0" dy="26">→ 前向时间分配</tspan><tspan x="1350.0" dy="26">→ 修复排程</tspan></text><text x="60" y="835" class="note" text-anchor="start">修复目标：完工时间与相对基准的开工、站位、团队偏离。</text></svg>