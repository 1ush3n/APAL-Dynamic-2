<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
    .title { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 34px; font-weight: 700; fill: #111; }
    .subtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 22px; font-weight: 600; fill: #111; }
    .boxtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 24px; font-weight: 700; fill: #111; }
    .boxtext { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 20px; font-weight: 500; fill: #111; }
    .small { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 18px; font-weight: 500; fill: #111; }
    .tiny { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 16px; font-weight: 500; fill: #111; }
    .note { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 19px; font-weight: 700; fill: #111; }
    .dash { stroke-dasharray: 8 8; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
  <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="white"/>
<text x="70" y="60" class="title" text-anchor="start">技术路线二：异构联合调度与计划稳定性（方案 A2）</text><line x1="60" y1="88" x2="1540" y2="88" stroke="#222" stroke-width="2.2"/><text x="60" y="126" class="subtitle" text-anchor="start">中央共享引擎型：把“共同的异构表示与联合动作”放在中心，两侧分别对应正常安排与受扰修复。</text><rect x="90" y="210" width="300" height="170" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="240.0" y="244" class="boxtitle" text-anchor="middle">正常安排输入</text><text x="240.0" y="276.0" class="boxtext" text-anchor="middle"><tspan x="240.0" dy="0">工艺前序</tspan><tspan x="240.0" dy="26">当前资源状态</tspan></text><rect x="90" y="505" width="300" height="190" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="240.0" y="539" class="boxtitle" text-anchor="middle">受扰修复输入</text><text x="240.0" y="568.0" class="boxtext" text-anchor="middle"><tspan x="240.0" dy="0">固定基准计划</tspan><tspan x="240.0" dy="26">已揭示释放条件</tspan><tspan x="240.0" dy="26">冻结/绑定继承</tspan></text><rect x="470" y="195" width="650" height="515" rx="10" ry="10" fill="#f7f7f7" stroke="#222" stroke-width="2.2"/><text x="795.0" y="229" class="boxtitle" text-anchor="middle">共同的异构表示与联合动作</text><rect x="560" y="275" width="230" height="135" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="675.0" y="309" class="boxtitle" text-anchor="middle">异构图编码</text><text x="675.0" y="323.5" class="boxtext" text-anchor="middle"><tspan x="675.0" dy="0">工序 / 站位</tspan><tspan x="675.0" dy="26">人员 / 技能</tspan></text><rect x="840" y="255" width="200" height="175" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="940.0" y="289" class="boxtitle" text-anchor="middle">自回归联合选择</text><text x="940.0" y="350.5" class="boxtext" text-anchor="middle"><tspan x="940.0" dy="0">工序 → 站位 → 具体团队</tspan></text><rect x="660" y="505" width="270" height="90" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="795.0" y="539" class="boxtitle" text-anchor="middle">前向时间分配</text><text x="795.0" y="558.0" class="boxtext" text-anchor="middle"><tspan x="795.0" dy="0">约束掩码屏蔽非法候选</tspan></text><line x1="390" y1="295" x2="470" y2="295" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="390" y1="600" x2="470" y2="600" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="790" y1="342" x2="840" y2="342" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="940" y1="430" x2="940" y2="505" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1220" y="225" width="250" height="145" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1345.0" y="259" class="boxtitle" text-anchor="middle">初始排程</text><text x="1345.0" y="278.5" class="boxtext" text-anchor="middle"><tspan x="1345.0" dy="0">可行站位与团队</tspan><tspan x="1345.0" dy="26">工序起止时刻</tspan></text><rect x="1220" y="500" width="250" height="165" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1345.0" y="534" class="boxtitle" text-anchor="middle">修复排程</text><text x="1345.0" y="563.5" class="boxtext" text-anchor="middle"><tspan x="1345.0" dy="0">完工时间</tspan><tspan x="1345.0" dy="26">开工 / 站位 / 团队偏离</tspan></text><line x1="1120" y1="342" x2="1220" y2="300" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="930" y1="550" x2="1220" y2="580" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><text x="520" y="760" class="note" text-anchor="start">共享核心：异构关系表示 + 联合动作 + 前向可行时间；差异主要来自输入条件与允许调整范围。</text><text x="520" y="815" class="note" text-anchor="start">受扰修复保留冻结安排与既有站位绑定，在允许范围内兼顾效率和稳定性。</text></svg>