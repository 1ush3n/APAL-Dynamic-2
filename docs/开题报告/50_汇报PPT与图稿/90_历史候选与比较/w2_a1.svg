<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
    .title { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 34px; font-weight: 700; fill: #111; }
    .subtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 22px; font-weight: 600; fill: #111; }
    .boxtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 24px; font-weight: 700; fill: #111; }
    .boxtext { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 20px; font-weight: 500; fill: #111; }
    .small { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 18px; font-weight: 500; fill: #111; }
    .tiny { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 16px; font-weight: 500; fill: #111; }
    .note { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 19px; font-weight: 700; fill: #111; }
    .dash { stroke-dasharray: 8 8; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
  <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="white"/>
<text x="70" y="60" class="title" text-anchor="start">技术路线二：异构联合调度与计划稳定性（方案 A1）</text><line x1="60" y1="88" x2="1540" y2="88" stroke="#222" stroke-width="2.2"/><text x="60" y="126" class="subtitle" text-anchor="start">上下双阶段型：上半说明异构联合构造，下半说明受扰修复；二者通过共享机制显式连接。</text><text x="70" y="185" class="boxtitle" text-anchor="start">异构联合构造</text><rect x="60" y="215" width="500" height="250" rx="10" ry="10" fill="#f7f7f7" stroke="#222" stroke-width="2.2"/><rect x="100" y="260" width="120" height="55" rx="6" ry="6" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="160.0" y="295.5" class="boxtext" text-anchor="middle"><tspan x="160.0" dy="0">工序</tspan></text><rect x="270" y="260" width="120" height="55" rx="6" ry="6" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="330.0" y="295.5" class="boxtext" text-anchor="middle"><tspan x="330.0" dy="0">站位</tspan></text><rect x="100" y="395" width="120" height="55" rx="28" ry="28" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="160.0" y="430.5" class="boxtext" text-anchor="middle"><tspan x="160.0" dy="0">人员</tspan></text><polygon points="345,382 400,422 345,462 290,422" fill="white" stroke="#222" stroke-width="2"/><text x="345" y="430" class="small" text-anchor="middle">技能</text><line x1="220" y1="287" x2="270" y2="287" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><text x="245" y="278" class="tiny" text-anchor="middle">归属</text><line x1="160" y1="315" x2="160" y2="395" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><text x="188" y="365" class="tiny" text-anchor="start">安排</text><line x1="220" y1="422" x2="290" y2="422" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><text x="255" y="410" class="tiny" text-anchor="middle">资格</text><line x1="345" y1="382" x2="345" y2="315" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><text x="376" y="355" class="tiny" text-anchor="start">需求</text><text x="320" y="430" class="small" text-anchor="middle"><tspan x="320" dy="0">工序、站位、人员、技能四类节点；</tspan><tspan x="320" dy="28">前序、归属、需求、资格等关系分别参与编码。</tspan></text><rect x="620" y="250" width="260" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="750.0" y="284" class="boxtitle" text-anchor="middle">异构图编码</text><text x="750.0" y="318.0" class="boxtext" text-anchor="middle"><tspan x="750.0" dy="0">按关系传播与读出</tspan></text><rect x="955" y="240" width="430" height="160" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1170.0" y="274" class="boxtitle" text-anchor="middle">自回归联合选择</text><rect x="1000" y="300" width="90" height="50" rx="5" ry="5" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1045.0" y="333.0" class="boxtext" text-anchor="middle"><tspan x="1045.0" dy="0">工序</tspan></text><rect x="1120" y="300" width="90" height="50" rx="5" ry="5" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1165.0" y="333.0" class="boxtext" text-anchor="middle"><tspan x="1165.0" dy="0">站位</tspan></text><rect x="1240" y="290" width="110" height="70" rx="5" ry="5" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1295.0" y="306.0" class="boxtext" text-anchor="middle"><tspan x="1295.0" dy="0">具体</tspan><tspan x="1295.0" dy="26">团队</tspan></text><line x1="560" y1="340" x2="620" y2="310" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="880" y1="310" x2="955" y2="320" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1090" y1="325" x2="1120" y2="325" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1210" y1="325" x2="1240" y2="325" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="980" y="420" width="380" height="70" rx="6" ry="6" fill="#fafafa" stroke="#222" stroke-width="2.2"/><text x="1170.0" y="463.0" class="boxtext" text-anchor="middle"><tspan x="1170.0" dy="0">前向时间分配与状态更新 → 形成可行初始排程</tspan></text><line x1="1295" y1="360" x2="1295" y2="420" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><text x="735" y="510" class="small" text-anchor="middle">共享表示 / 联合选择 / 可行时间分配</text><path d=" M 750 495 L 750 560" fill="none" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)" class="dash"/><text x="70" y="570" class="boxtitle" text-anchor="start">受扰后的计划修复</text><rect x="60" y="600" width="1460" height="210" rx="10" ry="10" fill="#f7f7f7" stroke="#222" stroke-width="2.2"/><rect x="95" y="655" width="250" height="95" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="220.0" y="683.5" class="boxtext" text-anchor="middle"><tspan x="220.0" dy="0">固定基准计划</tspan><tspan x="220.0" dy="26">已揭示释放延迟</tspan></text><rect x="410" y="645" width="250" height="115" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="535.0" y="683.5" class="boxtext" text-anchor="middle"><tspan x="535.0" dy="0">保留冻结条目</tspan><tspan x="535.0" dy="26">继承人员站位绑定</tspan></text><rect x="730" y="655" width="300" height="95" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="880.0" y="683.5" class="boxtext" text-anchor="middle"><tspan x="880.0" dy="0">共享异构编码与联合选择</tspan><tspan x="880.0" dy="26">前向分配可行时间</tspan></text><rect x="1095" y="645" width="330" height="115" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1260.0" y="683.5" class="boxtext" text-anchor="middle"><tspan x="1260.0" dy="0">修复排程</tspan><tspan x="1260.0" dy="26">完工时间 + 开工/站位/团队偏离评价</tspan></text><line x1="345" y1="702" x2="410" y2="702" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="660" y1="702" x2="730" y2="702" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1030" y1="702" x2="1095" y2="702" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><text x="60" y="845" class="note" text-anchor="start">冻结范围按基准开工时刻划分；阶段内保留既有站位绑定，在允许范围内兼顾效率与稳定性。</text></svg>