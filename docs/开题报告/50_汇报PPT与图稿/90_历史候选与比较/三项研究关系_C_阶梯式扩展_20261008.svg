<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>三项研究工作的递进关系</title>
<desc>无扰动同构图联合调度，扩展到异构图下的工序延迟开工响应，再研究语义增强的多架次实际协同。箭头表示研究需求扩展。</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#000"/></marker></defs>
<rect width="1600" height="900" fill="#fff"/>
<text x="72" y="100" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="52" font-weight="600" fill="#000" text-anchor="start">三项研究工作的递进关系</text>
<line x1="72" y1="126" x2="1528" y2="126" stroke="#000" stroke-width="2" />
<text x="72" y="165" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="28" font-weight="600" fill="#000" text-anchor="start">工作一</text>
<rect x="72" y="183" width="440" height="164" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="96" y="231" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="32" font-weight="600" fill="#000" text-anchor="start">无扰动静态联合调度</text>
<text x="96" y="279" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="30" font-weight="400" fill="#000" text-anchor="start">同构图统一表示</text>
<text x="96" y="322" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="27" font-weight="400" fill="#000" text-anchor="start">联合选择工序、站位与团队</text>
<text x="555" y="365" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="28" font-weight="600" fill="#000" text-anchor="start">工作二</text>
<rect x="555" y="383" width="440" height="164" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="579" y="431" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="32" font-weight="600" fill="#000" text-anchor="start">延迟开工后的动态调度</text>
<text x="579" y="479" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="30" font-weight="400" fill="#000" text-anchor="start">异构图联合调度</text>
<text x="579" y="522" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="27" font-weight="400" fill="#000" text-anchor="start">兼顾完工时间与计划稳定性</text>
<text x="1038" y="565" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="28" font-weight="600" fill="#000" text-anchor="start">工作三</text>
<rect x="1038" y="583" width="440" height="164" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1062" y="631" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="32" font-weight="600" fill="#000" text-anchor="start">多架次协同动态调度</text>
<text x="1062" y="679" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="30" font-weight="400" fill="#000" text-anchor="start">语义增强图网络</text>
<text x="1062" y="722" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="27" font-weight="400" fill="#000" text-anchor="start">当前脉动与紧邻下一周期</text>
<polyline points="512,265 534,265 534,465 555,465" fill="none" stroke="#000" stroke-width="2.3" marker-end="url(#arr)"/>
<polyline points="995,465 1017,465 1017,665 1038,665" fill="none" stroke="#000" stroke-width="2.3" marker-end="url(#arr)"/>
<text x="582" y="265" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="28" font-weight="400" fill="#000" text-anchor="start">进一步区分关系</text>
<text x="582" y="309" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="28" font-weight="400" fill="#000" text-anchor="start">响应延迟开工后的计划调整</text>
<text x="1064" y="463" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="28" font-weight="400" fill="#000" text-anchor="start">进一步跟踪多架飞机</text>
<text x="1064" y="507" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="28" font-weight="400" fill="#000" text-anchor="start">考虑共同脉动与下一周期</text>
<line x1="72" y1="803" x2="1528" y2="803" stroke="#000" stroke-width="1.8" />
<text x="800" y="854" font-family="Droid Sans Fallback, SimSun, sans-serif" font-size="29" font-weight="400" fill="#000" text-anchor="middle">共同基础：工艺与人员约束，工序、站位与团队的联合决策</text>
</svg>