<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
    .title { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 34px; font-weight: 700; fill: #111; }
    .subtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 22px; font-weight: 600; fill: #111; }
    .boxtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 24px; font-weight: 700; fill: #111; }
    .boxtext { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 20px; font-weight: 500; fill: #111; }
    .small { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 18px; font-weight: 500; fill: #111; }
    .tiny { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 16px; font-weight: 500; fill: #111; }
    .note { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 19px; font-weight: 700; fill: #111; }
    .dash { stroke-dasharray: 8 8; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
  <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="white"/>
<text x="70" y="60" class="title" text-anchor="start">技术路线三：语义增强的多架次协同动态调度（方案 A2）</text><line x1="60" y1="88" x2="1540" y2="88" stroke="#222" stroke-width="2.2"/><text x="60" y="126" class="subtitle" text-anchor="start">语义核心型：把“工序/飞机—站位—整线”的分层结构与两类时间后果直接放大展示。</text><rect x="70" y="190" width="250" height="180" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="195.0" y="224" class="boxtitle" text-anchor="middle">真实多架次环境</text><text x="195.0" y="261.0" class="boxtext" text-anchor="middle"><tspan x="195.0" dy="0">不同飞机驻站并行</tspan><tspan x="195.0" dy="26">共同脉动时同步前移</tspan></text><rect x="70" y="430" width="250" height="140" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="195.0" y="464" class="boxtitle" text-anchor="middle">最新现场状态</text><text x="195.0" y="481.0" class="boxtext" text-anchor="middle"><tspan x="195.0" dy="0">当前进度</tspan><tspan x="195.0" dy="26">最近已知变化</tspan></text><rect x="390" y="185" width="430" height="450" rx="10" ry="10" fill="#f7f7f7" stroke="#222" stroke-width="2.2"/><text x="605.0" y="219" class="boxtitle" text-anchor="middle">分层状态表示（核心）</text><rect x="470" y="245" width="270" height="80" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="605.0" y="293.0" class="boxtext" text-anchor="middle"><tspan x="605.0" dy="0">工序 / 飞机：当前、下一及更后摘要</tspan></text><rect x="470" y="365" width="270" height="80" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="605.0" y="413.0" class="boxtext" text-anchor="middle"><tspan x="605.0" dy="0">站位：当前/下一任务与本站资源</tspan></text><rect x="470" y="485" width="270" height="80" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="605.0" y="533.0" class="boxtext" text-anchor="middle"><tspan x="605.0" dy="0">整线：各站负荷与批次进度</tspan></text><rect x="875" y="270" width="170" height="145" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="960.0" y="304" class="boxtitle" text-anchor="middle">MLP 融合</text><text x="960.0" y="350.5" class="boxtext" text-anchor="middle"><tspan x="960.0" dy="0">形成分层表示</tspan></text><rect x="1100" y="190" width="350" height="240" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1275.0" y="224" class="boxtitle" text-anchor="middle">状态后果语义</text><text x="1275.0" y="291.0" class="boxtext" text-anchor="middle"><tspan x="1275.0" dy="0">当前共同脉动时间：启发式估计的修正量</tspan><tspan x="1275.0" dy="26">下一周期各站就绪偏差：正值晚，负值早</tspan></text><rect x="1100" y="495" width="350" height="140" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1275.0" y="529" class="boxtitle" text-anchor="middle">联合动作</text><text x="1275.0" y="573.0" class="boxtext" text-anchor="middle"><tspan x="1275.0" dy="0">工序、站位、团队与对齐</tspan></text><line x1="320" y1="280" x2="390" y2="280" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="320" y1="500" x2="390" y2="500" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="740" y1="405" x2="875" y2="342" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1045" y1="342" x2="1100" y2="310" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1275" y1="430" x2="1275" y2="495" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><text x="390" y="700" class="note" text-anchor="start">在线编码与分层 MLP 产生候选表示；无梯度预测数值在动作前进入决策。</text><text x="390" y="755" class="note" text-anchor="start">主讲重点：比较当前共同等待与紧邻下一周期站位负荷，从而支持多架次协同调度。</text></svg>