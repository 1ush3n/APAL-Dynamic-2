<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
    .title { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 34px; font-weight: 700; fill: #111; }
    .subtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 22px; font-weight: 600; fill: #111; }
    .boxtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 24px; font-weight: 700; fill: #111; }
    .boxtext { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 20px; font-weight: 500; fill: #111; }
    .small { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 18px; font-weight: 500; fill: #111; }
    .tiny { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 16px; font-weight: 500; fill: #111; }
    .note { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 19px; font-weight: 700; fill: #111; }
    .dash { stroke-dasharray: 8 8; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
  <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="white"/>
<text x="70" y="60" class="title" text-anchor="start">技术路线一：同构图下的联合静态调度（方案 A3）</text><line x1="60" y1="88" x2="1540" y2="88" stroke="#222" stroke-width="2.2"/><text x="60" y="126" class="subtitle" text-anchor="start">双层构造型：上层负责“表示与完整动作”，下层负责“约束落实与状态演化”。</text><rect x="80" y="190" width="300" height="180" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="230.0" y="224" class="boxtitle" text-anchor="middle">调度状态</text><text x="230.0" y="261.0" class="boxtext" text-anchor="middle"><tspan x="230.0" dy="0">工艺与资源状态</tspan><tspan x="230.0" dy="26">完整工序图可见</tspan></text><rect x="450" y="190" width="340" height="180" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="620.0" y="224" class="boxtitle" text-anchor="middle">同构图编码</text><text x="620.0" y="261.0" class="boxtext" text-anchor="middle"><tspan x="620.0" dy="0">共享传播</tspan><tspan x="620.0" dy="26">形成节点/全局上下文</tspan></text><rect x="860" y="165" width="420" height="230" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1070.0" y="199" class="boxtitle" text-anchor="middle">完整动作</text><rect x="920" y="245" width="300" height="60" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1070.0" y="283.0" class="boxtext" text-anchor="middle"><tspan x="1070.0" dy="0">工序 i  ·  站位 m  ·  具体团队 W</tspan></text><text x="1070" y="330" class="small" text-anchor="middle"><tspan x="1070" dy="0">自回归条件选择：</tspan><tspan x="1070" dy="28">后续选择以前面的结果为条件。</tspan></text><line x1="380" y1="280" x2="450" y2="280" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="790" y1="280" x2="860" y2="280" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="130" y="500" width="260" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="260.0" y="534" class="boxtitle" text-anchor="middle">合法性掩码</text><text x="260.0" y="568.0" class="boxtext" text-anchor="middle"><tspan x="260.0" dy="0">前序、资格、人数、绑定</tspan></text><rect x="470" y="500" width="280" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="610.0" y="534" class="boxtitle" text-anchor="middle">前向时间分配</text><text x="610.0" y="528.0" class="boxtext" text-anchor="middle"><tspan x="610.0" dy="0">前驱完成</tspan><tspan x="610.0" dy="26">人员日历</tspan><tspan x="610.0" dy="26">起止安排</tspan></text><rect x="840" y="500" width="320" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1000.0" y="534" class="boxtitle" text-anchor="middle">状态更新</text><text x="1000.0" y="568.0" class="boxtext" text-anchor="middle"><tspan x="1000.0" dy="0">更新安排、占用与首次使用绑定</tspan></text><rect x="1250" y="500" width="240" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1370.0" y="534" class="boxtitle" text-anchor="middle">下一状态</text><text x="1370.0" y="541.0" class="boxtext" text-anchor="middle"><tspan x="1370.0" dy="0">继续构造</tspan><tspan x="1370.0" dy="26">直至完成</tspan></text><line x1="1070" y1="395" x2="1070" y2="500" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="390" y1="560" x2="470" y2="560" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="750" y1="560" x2="840" y2="560" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1160" y1="560" x2="1250" y2="560" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><path d=" M 1370 620 L 1370 690 L 230 690 L 230 620" fill="none" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><text x="800" y="686" class="small" text-anchor="middle">状态闭环：更新后的状态重新进入上层表示与选择</text><rect x="530" y="740" width="540" height="90" rx="10" ry="10" fill="#f2f2f2" stroke="#222" stroke-width="2.2"/><text x="800.0" y="774" class="boxtitle" text-anchor="middle">PPO 训练反馈</text><text x="800.0" y="793.0" class="boxtext" text-anchor="middle"><tspan x="800.0" dy="0">依据排程代价更新策略与价值估计；不改变上述构造职责分工</tspan></text><path d=" M 950 740 L 950 690" fill="none" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><text x="60" y="847" class="note" text-anchor="start">主讲重点：同构图统一表示 + 联合动作构造 + 约束落实，其他实现细节保持从属。</text></svg>