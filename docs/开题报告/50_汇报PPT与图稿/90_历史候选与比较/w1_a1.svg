<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
    .title { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 34px; font-weight: 700; fill: #111; }
    .subtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 22px; font-weight: 600; fill: #111; }
    .boxtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 24px; font-weight: 700; fill: #111; }
    .boxtext { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 20px; font-weight: 500; fill: #111; }
    .small { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 18px; font-weight: 500; fill: #111; }
    .tiny { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 16px; font-weight: 500; fill: #111; }
    .note { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 19px; font-weight: 700; fill: #111; }
    .dash { stroke-dasharray: 8 8; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
  <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="white"/>
<text x="70" y="60" class="title" text-anchor="start">技术路线一：同构图下的联合静态调度（方案 A1）</text><line x1="60" y1="88" x2="1540" y2="88" stroke="#222" stroke-width="2.2"/><text x="60" y="126" class="subtitle" text-anchor="start">强化版构造闭环：突出“编码—联合选择—时间落实—状态反馈”的完整排程构造过程</text><rect x="70" y="180" width="290" height="380" rx="10" ry="10" fill="#f7f7f7" stroke="#222" stroke-width="2.2"/><text x="215.0" y="214" class="boxtitle" text-anchor="middle">1  同构图统一编码</text><text x="215.0" y="351.0" class="boxtext" text-anchor="middle"><tspan x="215.0" dy="0">完整工序图与资源信息</tspan><tspan x="215.0" dy="26">共享传播规则与参数</tspan></text><line x1="133.0" y1="263.5" x2="237.5" y2="244.5" stroke="#333" stroke-width="2"/><line x1="237.5" y1="244.5" x2="342.0" y2="268.25" stroke="#333" stroke-width="2"/><line x1="133.0" y1="263.5" x2="185.25" y2="349.0" stroke="#333" stroke-width="2"/><line x1="237.5" y1="244.5" x2="185.25" y2="349.0" stroke="#333" stroke-width="2"/><line x1="237.5" y1="244.5" x2="294.5" y2="353.75" stroke="#333" stroke-width="2"/><line x1="342.0" y1="268.25" x2="294.5" y2="353.75" stroke="#333" stroke-width="2"/><line x1="185.25" y1="349.0" x2="147.25" y2="444.0" stroke="#333" stroke-width="2"/><line x1="294.5" y1="353.75" x2="327.75" y2="448.75" stroke="#333" stroke-width="2"/><line x1="185.25" y1="349.0" x2="327.75" y2="448.75" stroke="#333" stroke-width="2"/><circle cx="133.0" cy="263.5" r="24.7" fill="white" stroke="#222" stroke-width="2"/><text x="133.0" y="269.5" class="tiny" text-anchor="middle">工1</text><circle cx="237.5" cy="244.5" r="24.7" fill="white" stroke="#222" stroke-width="2"/><text x="237.5" y="250.5" class="tiny" text-anchor="middle">工2</text><circle cx="342.0" cy="268.25" r="24.7" fill="white" stroke="#222" stroke-width="2"/><text x="342.0" y="274.25" class="tiny" text-anchor="middle">工3</text><circle cx="185.25" cy="349.0" r="24.7" fill="white" stroke="#222" stroke-width="2"/><text x="185.25" y="355.0" class="tiny" text-anchor="middle">站1</text><circle cx="294.5" cy="353.75" r="24.7" fill="white" stroke="#222" stroke-width="2"/><text x="294.5" y="359.75" class="tiny" text-anchor="middle">站2</text><circle cx="147.25" cy="444.0" r="24.7" fill="white" stroke="#222" stroke-width="2"/><text x="147.25" y="450.0" class="tiny" text-anchor="middle">人1</text><circle cx="327.75" cy="448.75" r="24.7" fill="white" stroke="#222" stroke-width="2"/><text x="327.75" y="454.75" class="tiny" text-anchor="middle">人2</text><rect x="420" y="180" width="520" height="370" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="680.0" y="214" class="boxtitle" text-anchor="middle">2  条件联合选择</text><rect x="470" y="250" width="420" height="70" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="680.0" y="293.0" class="boxtext" text-anchor="middle"><tspan x="680.0" dy="0">工序  i ：选择合法工序</tspan></text><rect x="470" y="350" width="420" height="70" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="680.0" y="393.0" class="boxtext" text-anchor="middle"><tspan x="680.0" dy="0">站位  m ：以工序 i 为条件</tspan></text><rect x="470" y="450" width="420" height="70" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="680.0" y="493.0" class="boxtext" text-anchor="middle"><tspan x="680.0" dy="0">团队  W ：逐人选满给定人数</tspan></text><text x="680" y="558" class="small" text-anchor="middle"><tspan x="680" dy="0">掩码限制各步候选；选人时读取已选成员，</tspan><tspan x="680" dy="28">并更新剩余候选与给定人数。</tspan></text><rect x="990" y="180" width="230" height="165" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1105.0" y="214" class="boxtitle" text-anchor="middle">3  可行时间分配</text><text x="1105.0" y="230.5" class="boxtext" text-anchor="middle"><tspan x="1105.0" dy="0">前驱完成</tspan><tspan x="1105.0" dy="26">人员日历</tspan><tspan x="1105.0" dy="26">合法起止时刻</tspan></text><rect x="990" y="385" width="230" height="165" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1105.0" y="419" class="boxtitle" text-anchor="middle">4  状态更新</text><text x="1105.0" y="435.5" class="boxtext" text-anchor="middle"><tspan x="1105.0" dy="0">写入起止安排</tspan><tspan x="1105.0" dy="26">更新人员占用</tspan><tspan x="1105.0" dy="26">首次使用绑定</tspan></text><rect x="1260" y="280" width="250" height="95" rx="10" ry="10" fill="#efefef" stroke="#222" stroke-width="2.2"/><text x="1385.0" y="314" class="boxtitle" text-anchor="middle">输出</text><text x="1385.0" y="308.5" class="boxtext" text-anchor="middle"><tspan x="1385.0" dy="0">全部安排完成</tspan><tspan x="1385.0" dy="26">形成基准排程</tspan></text><line x1="360" y1="370" x2="420" y2="370" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="940" y1="370" x2="990" y2="260" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1105" y1="345" x2="1105" y2="385" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1220" y1="330" x2="1260" y2="328" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><path d=" M 1105 550 L 1105 610 L 215 610 L 215 560" fill="none" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)"/><text x="684" y="605" class="note" text-anchor="middle">更新后的状态进入下一完整动作</text><rect x="470" y="670" width="470" height="95" rx="10" ry="10" fill="#f2f2f2" stroke="#222" stroke-width="2.2"/><text x="705.0" y="704" class="boxtitle" text-anchor="middle">PPO 共同训练</text><text x="705.0" y="725.5" class="boxtext" text-anchor="middle"><tspan x="705.0" dy="0">沿用原奖励与采样轨迹；策略与价值共同更新</tspan></text><line x1="680" y1="550" x2="680" y2="670" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><text x="60" y="835" class="note" text-anchor="start">新同构方案需独立验证：约束满足情况、排程质量与推理成本。</text></svg>