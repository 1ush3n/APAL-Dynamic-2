<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
    .title { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 34px; font-weight: 700; fill: #111; }
    .subtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 22px; font-weight: 600; fill: #111; }
    .boxtitle { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 24px; font-weight: 700; fill: #111; }
    .boxtext { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 20px; font-weight: 500; fill: #111; }
    .small { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 18px; font-weight: 500; fill: #111; }
    .tiny { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 16px; font-weight: 500; fill: #111; }
    .note { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif; font-size: 19px; font-weight: 700; fill: #111; }
    .dash { stroke-dasharray: 8 8; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
  <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="white"/>
<text x="70" y="60" class="title" text-anchor="start">技术路线三：语义增强的多架次协同动态调度（方案 A3）</text><line x1="60" y1="88" x2="1540" y2="88" stroke="#222" stroke-width="2.2"/><text x="60" y="126" class="subtitle" text-anchor="start">事件—后果闭环型：围绕“事件刷新 → 时间后果 → 联合决策 → 实际结果 → 事后学习”的主线组织。</text><rect x="130" y="220" width="220" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="240.0" y="254" class="boxtitle" text-anchor="middle">事件刷新</text><text x="240.0" y="261.0" class="boxtext" text-anchor="middle"><tspan x="240.0" dy="0">开工、完成</tspan><tspan x="240.0" dy="26">扰动揭示、共同脉动</tspan></text><rect x="420" y="200" width="280" height="160" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="560.0" y="234" class="boxtitle" text-anchor="middle">状态理解</text><text x="560.0" y="261.0" class="boxtext" text-anchor="middle"><tspan x="560.0" dy="0">完整图编码</tspan><tspan x="560.0" dy="26">工序/飞机—站位—整线分层表示</tspan></text><rect x="770" y="200" width="280" height="160" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="910.0" y="234" class="boxtitle" text-anchor="middle">时间后果语义</text><text x="910.0" y="261.0" class="boxtext" text-anchor="middle"><tspan x="910.0" dy="0">当前共同脉动修正</tspan><tspan x="910.0" dy="26">下一周期各站有符号就绪偏差</tspan></text><rect x="1120" y="220" width="220" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1230.0" y="254" class="boxtitle" text-anchor="middle">联合决策</text><text x="1230.0" y="261.0" class="boxtext" text-anchor="middle"><tspan x="1230.0" dy="0">工序、站位、团队</tspan><tspan x="1230.0" dy="26">留站 / 后移</tspan></text><rect x="1280" y="450" width="220" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="1390.0" y="484" class="boxtitle" text-anchor="middle">真实执行</text><text x="1390.0" y="491.0" class="boxtext" text-anchor="middle"><tspan x="1390.0" dy="0">非抢占执行</tspan><tspan x="1390.0" dy="26">按最晚就绪共同脉动</tspan></text><rect x="820" y="650" width="280" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="960.0" y="684" class="boxtitle" text-anchor="middle">结果回填 / 在线学习</text><text x="960.0" y="691.0" class="boxtext" text-anchor="middle"><tspan x="960.0" dy="0">分别回填当前/下周期标签</tspan><tspan x="960.0" dy="26">PPO + 时间辅助监督</tspan></text><rect x="420" y="650" width="280" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="560.0" y="684" class="boxtitle" text-anchor="middle">历史输入与待结算项</text><text x="560.0" y="718.0" class="boxtext" text-anchor="middle"><tspan x="560.0" dy="0">保存当时输入、预测值与掩码</tspan></text><rect x="110" y="450" width="230" height="120" rx="10" ry="10" fill="#f4f4f4" stroke="#222" stroke-width="2.2"/><text x="225.0" y="484" class="boxtitle" text-anchor="middle">最新现场状态</text><text x="225.0" y="491.0" class="boxtext" text-anchor="middle"><tspan x="225.0" dy="0">当前进度</tspan><tspan x="225.0" dy="26">最近已知变化</tspan></text><line x1="350" y1="280" x2="420" y2="280" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="700" y1="280" x2="770" y2="280" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1050" y1="280" x2="1120" y2="280" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1340" y1="340" x2="1390" y2="450" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1280" y1="510" x2="340" y2="510" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="340" y1="510" x2="225" y2="510" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1390" y1="570" x2="1390" y2="620" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><path d=" M 1390 620 L 960 620 L 960 650" fill="none" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="820" y1="710" x2="700" y2="710" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="420" y1="710" x2="225" y2="570" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><path d=" M 225 450 L 225 340" fill="none" stroke="#222" stroke-width="2.4" marker-end="url(#arrowSmall)" class="dash"/><text x="70" y="830" class="note" text-anchor="start">顶部物理主线：多架次驻站并行，只有占用站位全部就绪后才共同脉动；未知扰动不会提前进入状态。</text></svg>